name: GithubCi

on: [push]

jobs:
  test-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodjs
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  

  test-python:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with pylint
        run: pylint *.py

      - name: Run tests
        run: pytest
