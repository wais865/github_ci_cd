name: GithubCi

on: [push]

jobs:
  test-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodjs
    steps:
      - name: cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('nodejs/package-lock.json') }}

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  